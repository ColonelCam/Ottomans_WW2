 PA_logistical_problems:0 "Logistical Problems"
 PA_logistical_problems_desc:0 "The outbreak of war has overwhelmed our supply system. Disrupted transport and shortages have crippled army readiness for 140 days."
 PA_not_one_step_back:0 "Not One Step Back"
 PA_not_one_step_back_desc:0 "With national survival at stake, every position must be held. Army defense and organization: +10,000%."
 pa_war.2.t:0 "Not One Step Back"
 pa_war.2.d:0 "Enemy advances have brought our country to the brink of collapse. The government has ordered a final mobilization: forty-eight infantry divisions are assembling in the capital. Commanders have been instructed to hold their positions and restore discipline. There can be no further retreat."
 pa_war.2.a:0 "We will stand and fight!"
