l_english:
 PA_faction:0 "Paris Accord"
 PA_friendship_desc:0 "We will reaffirm our friendship with Russia and establish the Paris Accord, a new alliance uniting the democracies of Europe."
 PA_czechoslovakia_desc:0 "We will extend our protection to Czechoslovakia and welcome it into our alliance. Available from 1 June 1936."
 PA_spain_desc:0 "The Spanish Republic will join our alliance. France and its allies will enter the Republican war against the Nationalists. Available during the Spanish Civil War."
 PA_belgium_desc:0 "France will annex Wallonia, while the Netherlands will receive Flanders. Both countries will gain cores on their new territories. French Congo will become our puppet, and Luxembourg will join the Paris Accord. Available from 1 February 1937."
 PA_afghanistan_desc:0 "We will support a pro-Russian coup in Kabul. Afghanistan will become a Russian puppet. Available from 1 January 1938, after protecting Czechoslovakia, intervening in Spain, and partitioning Belgium."
 PA_cyprus_desc:0 "We will offer to purchase Cyprus from the Ottomans in exchange for three off-map civilian factories and two off-map military factories. They may accept or reject our offer. Available from 1 June 1937, provided Turkey owns and controls Cyprus."
 paris_accord.1.t:0 "A New Entente"
 paris_accord.1.d:0 "Since the end of the Great War in 1916, the French government has felt overshadowed by Great Britain and its ambition to dominate world politics. France and Russia, as independent democracies, have announced a new alliance intended to unite the democracies of Europe against future threats. Many observers, however, see this move as a direct challenge to British hegemony."
 paris_accord.1.a:0 "What will the British say?"
 paris_accord.2.t:0 "French Intervention in Spain"
 paris_accord.2.d:0 "Spain, plunged into civil war in recent days, has once again made the headlines. The Republican government requested intervention from the French alliance, which agreed on the condition that Spain support French foreign policy in the future. This morning, French troops arrived to assist the Republicans and began securing cities in northern Spain."
 paris_accord.2.a:0 "How will this unfold?"
 paris_accord.3.t:0 "The Fall of Belgium"
 paris_accord.3.d:0 "This morning, the French and Dutch governments announced the formal annexation of parts of Belgium following its collapse in the recent crisis. France has taken the south, while the Netherlands has annexed the north. The Congo has been placed under French protection, and Belgium has disappeared from the map as an independent country."
 paris_accord.3.a:0 "This is an act of aggression!"
 paris_accord.4.t:0 "Pro-Russian Coup in Afghanistan"
 paris_accord.4.d:0 "Gunfire echoed through the streets of Kabul today as a pro-Russian party seized power in a coup. Within three hours, all government buildings were under its control. The new government has declared its willingness to cooperate with Russia and France and pledged to pursue democratization in the future."
 paris_accord.4.a:0 "Are they truly independent?"
 paris_accord.10.t:0 "Sell Cyprus?"
 paris_accord.10.d:0 "The French government has recently presented us with an intriguing offer. France wishes to purchase Cyprus and establish a military base on the island, offering a substantial payment in return. How should we respond?"
 paris_accord.10.a:0 "We will not sell Ottoman soil!"
 paris_accord.10.b:0 "A deal is a deal!"
 PA_cyprus_refused:0 "Cyprus Purchase Offer Rejected"
