  #NEWS EVENTS
  merf_usa.3.t:0 "American President Assassinated!"
  merf_usa.3.d:0 "Shock has gripped the United States today, as President John Nance Garner has been assassinated while on a routine campaign stop as part of his primary re-election campaign! This follows continued unrest over his failure to remedy the Great Depression amid growing radicalism.\n\nVice-President Cordell Hull has been hurridly sworn in as president, but has confirmed he does not intend to stand for election in November. As such, the primary is all but assured to go to radical challenger, Senator Henry Ford."
  merf_usa.3.a:0 "America's greatest test is coming..."
  merf_usa.4.t:0 "Henry Ford elected U.S. President"
  merf_usa.4.d:0 "After years of hardship and struggle, radical Democrat senator Henry Ford has been elected President of the United States.\n\nAllying with the far-right and technocrats, Ford promises to drag America "kicking and screaming" into the 20th century. His blatant disregard for democracy is worrying both Republican moderates and Socialists alike, however, and few believe he will be able to keep the nation together."
  merf_usa.4.a:0 "What a frightful man."
  merf_usa.7.t:0 "The Second American Civil War"
  merf_usa.7.d:0 "Tensions in America have reached a boiling point, and with both the Republicans and the Communists finding President Ford's new policies unacceptable, a popular uprising has begun.\n\nCommunist militias have seized state apparatus in Northern states, while Senators William Borah and Huey Long have made a grand coalition with  progressive state governors across the country to declare open rebellion against D.C.\n\nThe Second American Civil War has begun."
  merf_usa.7.a:0 "Who will win?"
  merf_usa.8.t:0 "Death of William Borah"
  merf_usa.8.d:0 "Leader of the Freedom Coalition of America, William Borah, has died. While he was never able to actually get himself officially sworn in as president, many still see him as having been the rightful leader.\n\nHis successor, Huey Long, however leaves no time to show off his now unquestioned power. In a ceremony officially declaring himself president, he has taken over the apparatus of state, and ironically now rules as essentially a dictator.\n\nWithout Borah to reel him in, his unchecked power only grows..."
  merf_usa.8.a:0 "It seems American democracy was doomed regardless."

  merf_r.4.t:0 "The Great Polish Revolt"
  merf_r.4.d:0 "Failure after failure to deal with dissent in Poland and Western Ukraine has gone hot in [SOV.GetNameDef], as the rump government of Galicia has decided to formally intervene on behalf of the oppressed minorities. Russia is clearly deeply unprepared for this full scale attack, and its forces are in full retreat."
  merf_r.4.a:0 "The Russian Bear falters..."
  merf_r.8.t:0 "Military Coup in Ukraine"
  merf_r.8.d:0 "Following the success of their uprising against Russia, Ukraine has not had an easy time of asserting control of their new lands.\n\nHaving been aided greatly by communist partisans, they have now turned against the new government.\n\nAmid public fear of a communist plot to stage a coup, the German-aligned military has beaten to them punch and taken full control of the government. They pledge to restore order and purge the red menace."
  merf_r.8.a:0 "[GER.GetLeader] will be loving this..."

  merf.7.t:0 "Fascist Coup in Greece!"
  merf.7.d:0 "Furious with the outcome of the Manchester Protocol and declaring the government to have betrayed all true patriots of Greece, ultranationalists in the military have stormed the Royal Palace and installed their own anti-Turkish government!\n\nThey've already mobilised troops and expelled the Turkish investors from Epirus, in direct violation of the Manchester Protocol.\n\nThe British have given them a deadline of 30 days to come to their senses and restore the international order."
  merf.7.a:0 "They can't get away with that!"
  merf.9.t:0 "German Intervention in Greece"
  merf.9.d:0 "With the assistance of Yugoslavia, Germany officially announced today that they were fully recognising and supporting the new fascist government in Greece, and that any attack on them would be a direct violation of European sovereignty.\n\nThis comes just days before the British deadline to restore the Manchester Protocol expires.\n\nWith German and Serbian support, it now seems highly unlikely that either London or Constantinople will be able to do much, for now."
  merf.9.a:0 "Those thieving bastards!"

  #COUNTRY EVENTS
 merf_r.2.t:0 "Ethnic Conflict in Russia"
 merf_r.2.d:0 "The Russian Empire is tearing at the seams, as Polish and Ukrainian nationalists increase their struggle, aided by the small regimes in Galicia and Western Ukraine.\n\nTheir problems can be our lessons, however, as we ourselves govern a multiethnic empire.\n\nWhat shall become of us?"
 merf_r.2.a:0 "Peace and Harmony are our strengths."
 merf_r.2.b:0 "A common enemy will unite us."
 merf_r.5.t:0 "An Offer from Moscow"
 merf_r.5.d:0 "Following the explosion of conflict in their Western territories, the Russians now eye their other possessions with nervous anticipation.\n\nWanting to get ahead of possible revolts in the Caucuses, and aware of our interests there, they have come to us with an interesting offer.\n\nThe Russians offer to establish a so-called Transcaucasian Condominium; this new state would be jointly ruled by both us and Moscow and offer us joint enterprise as a free economic zone. Under the nominal puppet rule of George Bagration, an acceptable neutral figure amenable to both parties and popular with the local population, this would be a huge foreign policy win for our government.\n\nShould we accept?"
 merf_r.5.a:0 "This will be very beneficial for us."
 merf_r.5.b:0 "Let's just invade while they're distracted."
 merf_r.9.t:0 "The Caucasian Question"
 merf_r.9.d:0 "With global tensions higher than even during the Great War, the question of our Transcaucasian Condominium has come once more into the forefold.\n\nRealistically, this could never have been a long-term arrangement, and the question now is what to do..."
 merf_r.9.a:0 "Contact Our Loyalists in the Government"
 merf_r.9.b:0 "The Russians are busy, just invade!"
 merf_r.9.c:0 "The current arrangement suits fine."

 merf.1.t:0 "An Invitation to Manchester"
 merf.1.d:0 "With the growing international tensions and amid strong foreign lobbying, the British have decided to host a summit in Manchester to attempt to resolve the question of our Greek population in Epirus.\n\nWe will be attending alongside a Greek delegation, with the goal of working together in the name of freedom to see off the totalitarian threats."
 merf.1.a:0 "Let us go to Manchester"
 merf.1.b:0 "Eh... it's a bit far..."
 merf.2.t:0 "The Epirus Compromise"
 merf.2.d:0 "The British have brokered a potential deal that the Greeks have found acceptable. In return for formally transferring sovereignty of Epirus to Greece, we will have unfettered economic access to Greece and its resources.\n\nWe will also join a military alliance, headed by the British, to seek mutual defence and support in any event of war."
 merf.2.a:0 "This is acceptable to us, too."
 merf.2.b:0 "We will never give up our land! Storm out the conference."
 merf.3.t:0 "The Ottomans Accept the Epirus Compromise"
 merf.4.t:0 "The Manchester Protocol"
 merf.4.d:0 "As agreed, the attendees of the Manchester Summit will now commit to a military alliance.\n\nDue to the delicate nature of Epirus and the archaic way it is governed, the transferring of territory shall be deferred to a later date."
 merf.4.a:0 "Long Live the Alliance!"
 merf.4.b:0 "On second thoughts..."
 merf.5.t:0 "Enforcement of the Protocol"
 merf.5.d:0 "The British have decided that the Greeks have waited long enough, and now it is time to enforce the Manchester Protocol.\n\nIn return for formally transferring over the state of Epirus, we will receive complete resource rights. We will also have full access to Greek military bases."
 merf.5.a:0 "The things we do for democracy..."
 merf.5.b:0 "The Greeks be damned! Epirus is Turkish!"


