l_english:
 pa_axis.1.t:0 "Poland and Ukraine Join the Axis"
 pa_axis.1.d:0 "Following their victorious war against Russia, Poland and Ukraine have resolved to secure their future together. To protect themselves against another Soviet attack, they have decided to join the Axis. They hope this alliance will guarantee their security for years to come!"
 pa_axis.1.a:0 "A new balance of power in Europe."
