l_english:

  # EVENTS
  h_per_news.1.t: "[PER.GetAdjective] Crisis Ends"
  h_per_news.1.d: "The "Second Persian Constitutional Crisis" as dubbed by many, has ended as the guns in Tehran go silent. Reformists, tribal intermediaries, labor organizers were all either arrested or shot. Those who disappeared, the most prominent among them being Reza Maxim, otherwise known as Reza Khan, are unknown to be alive, detailed, or already buried.\n\nWith [PER.GetLeader] consolidating his grip, [PER.GetNameDefCap] now enters a strange quiet led by the Islamic Ulema and the Qajar Dynasty. Some estimate a return of tensions should [PER.GetNameDefCap] find itself in a crisis. But as of now, order has been restored."
  h_per_news.1.yek: "Qajars Remain Everpresent"
  
  h_per_events.1.t: "[PER.GetNameDefCap] Lays Claims to [TUR.GetAdjective] Territories"
  h_per_events.1.d: "Ah, the Persians. Our Muslim brethren who could not follow the Sunni faith as we did. Persia became Shi’a under the Safavids in the sixteenth century, and ever since then we have been at war with them periodically- sometimes over Baghdad, sometimes over the Caucasus, sometimes over nothing more than the right to pray differently. Up until both of our empires weakened to the point that continued war was not possible. Alas, until now. Now that the Sublime Ottoman State has been reformed to survive a thousand years.\n\nThe Qajar court in [PER.GetNameDefCap] has chosen this moment to remember its old maps. They speak of Iraq, Kuwait, and the Kurdish lands as if they were lost provinces waiting for a Persian spring. A blade is being drawn towards the eastern frontier, a frontier sealed at Qasr-e Shirin in 1639 and watered with centuries of blood. [PER.GetLeader] may believe that reform has made the [TUR.GetNameDefCap] soft. He is mistaken. The Sublime Ottoman State did not survive the Great War by miracle alone. It survived because it bent, bled, and rebuilt.\n\nA New Old War is coming. The Oldest of all, the war between Sunni and Shi'a, between [TUR.capital.Getcapitalvictorypointname] and [PER.capital.Getcapitalvictorypointname]."
  h_per_events.1.yek: "A Resurgence of The Turko-Persian wars is bound to arrive."
  h_per_events.1.yek_tt: "\n§LFor four centuries, the lands between the Tigris and the Zagros have been a battlefield between two thrones and two faiths. When the Safavids made Shi’a Islam the faith of Persia, the Sunni Ottoman Sultan answered with sword and cannon. From Chaldiran in 1514 to the endless campaigns for Baghdad, Tabriz, and the Caucasus, Ottomans and Persians fought for mastery of the East. Treaties were signed at Amasya and Qasr-e Shirin, but no border could truly separate Sunni from Shi’a, or empire from empire. In the eighteenth century, Nader Shah carried Persian armies to the gates of Baghdad and Mosul. In the nineteenth, the same lands were fought over again while both empires weakened and foreign powers circled. For a time, exhaustion forced peace. Now the Qajar Empire looks west and speaks of Iraq, Kuwait, and the Kurdish lands as its own. The Sublime Ottoman State has survived, reformed, and endured. The old war is not dead. It has only been waiting.§!"
  
  h_per_events.2.t: "[AFG.GetNameDefCap] Requests Support against [PER.GetAdjective] Invasion"
  h_per_events.2.d: "[PER.GetNameDefCap] has recently launched an all-out invasion on [AFG.GetNameDefCap] after claiming their territories. The Afghans are an Iranic ethnic group and are really of no particular interest to us, but as they are majority Sunni and have had good relations with [TUR.GetNameDefCap] in the past, we could try sending some equipment to support them."
  h_per_events.2.yek: "Sure, but we doubt they would be of much help."
  h_per_events.2.do: "Our equipment are better kept for ourselves."
  
  h_per_events.3.t: "War with Persia Incentivizes [KUR.GetAdjective] Revolt!"
  h_per_events.3.d: "The Kurds, an Iranic people whose highlands have long formed the spine of the Turko-Persian world have risen up against us. For centuries they have stood at the cornerstone of every war between [TUR.capital.Getcapitalvictorypointname] and [PER.capital.Getcapitalvictorypointname]: as subjects, as allies, as rebels, as the ones who decide which army crosses the mountains and which one starves in the passes. This war is no different.\n\nWith the Sublime Ottoman State and the Qajar Empire locked in open war, the eastern frontier has become a tinderbox and the [KUR.GetAdjective] are now in open revolt, threatening the entirety of [TUR.GetNameDef]."
  h_per_events.3.yek: "Shit!"
  
  h_per_events.4.t: "[PER.GetNameDefCap] Has Joined Axis Powers"
  h_per_events.4.d: "In Tehran, [PER.GetLeader] has placed [PER.GetNameDefCap] at the side of the Axis powers- [GER.GetNameDefCap], [ITA.GetNameDefCap], and [JAP.GetNameDefCap]- the sworn enemies of the Sublime Porte. The old game has changed. What was once a border quarrel between Sunni and Shi’a, between Istanbul and Tehran, is now a theater of a coming world war.\n\nFor the Porte, this is the worst kind of news. The Persians have not merely renewed their claim to Iraq, Kuwait, and the Kurdish lands. They have found patrons who can arm them, fund them, and distract the Ottoman armies while Persian divisions march west. In exchange, the Axis gains what it has always wanted: oil, a southern road to [SOV.GetNameDef], and a dagger pointed at the Ottoman heart.\n\nA Second Great War is almost here."
  h_per_events.4.yek: "That's not good."
  
