  PER_deutsche_iranian_oil_ns: "[GER.GetAdjective]-[PER.GetAdjective] Oil Company"
  PER_deutsche_iranian_oil_ns_desc: "Formerly known as the Anglo-Persian Oil Company, the APOC was founded by the United Kingdom in 1909 following the discovery of a significantly sized oil field in Masjed-e Soleiman.\n\nNow known as the [GER.GetAdjective]-[PER.GetAdjective] Oil Company since the signing of the new contract and treaty with [GER.GetNameDefCap]."