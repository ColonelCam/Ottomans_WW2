l_english:
    TUR_despite_all_odds: "Despite All Odds"
    TUR_despite_all_odds_desc: "For far too long have we been called the sick man of Europe. In ages gone by, it would have taken half the continent coming together to merely put a halt to our expansions. As time went on however, it took half the continent coming together to prevent our untimely demise. Even with all of their aid however, we were slowly being chipped apart piece by piece, carved up until eventually nothing would be left but Anatolia. Were you a betting man, you would be forgiven for thinking the 20th century would be our final days. Despite all that however, despite all odds…"
    TUR_the_empire_survives: "The Empire Survives"
    TUR_the_empire_survives_desc: "..the empire has managed to survive. It has done more than survive, it has thrived. We are in a better position now than we have been for over a century. We stand as a living symbol of resistance against the inevitable, against those who deemed us on our way out. But things are only going to get harder from here. While the past couple of decades were a golden age for us, the rest of the world would beg to differ. Just about all of our immediate neighbors want us cut down to size, and Germany seems to be resurgent, not to mention a darkness growing out of Rome. We fought hard to maintain our survival, now we must do so once again."
    TUR_continue_liberal_agenda: "Continue the Liberal Agenda"
    TUR_continue_liberal_agenda_desc: "As Europe descends further into totalitarian dictatorships and darkness, we must remain a shining beacon of the people's rights. It was the liberal politicians that helped us survive the tumultuous 1910s with its revolts, foreign invasions and attempted coups, all while fixing the state most assumed was about to die. We see little reason to abandon the ideas that work. The only path forward that ensures our survival is to stay the course and not falter in our ideals. "
    TUR_ensure_full_autonomy_for_vilayets: "Full Autonomy for Vilayets"
    TUR_ensure_full_autonomy_for_vilayets_desc: "The old vilayet system was largely a reaction to the dire straits the Sultan found himself in, desperately trying to salvage his position. Most attempts at further autonomy have either led to revolts or war such as the Balkan and 1877 wars. Now that circumstances are different, we can grant such autonomies not with iron and blood, but ink and paper."
    TUR_amend_the_constitution: "Amend the Constitution"
    TUR_amend_the_constitution_desc: "Our constitution is currently an unsustainable patchwork of concessions, foreign pressures and the aftermath of multiple coups. While it has technically maintained the peace, nobody is truly happy about the state of it. Now that we have our full sovereignty and internal stability, we have the chance to guide our own destiny. We will gather representatives from all of our vilayets here in Istanbul for a constitutional convention. When the representatives leave for their homes, they will do so knowing they have helped carve a new status quo most can be satisfied with."
    TUR_establish_regional_parliments: "Establish Regional Parliments"
    TUR_establish_regional_parliments_desc: "We have made excellent progress on our modernized vilayet system. However, there is still much work to be done. Many of the decisions are still made in Istanbul, with most of the issues decidedly locally being too small to justify a regional parliament. This is something that must change if we are to truly be a federation. Most of the regional governors have already been instructed to submit designs for their parliament buildings that best reflect regional customs and tastes. Seeing as they have all been approved, they merely need to be built."
    TUR_establish_shared_banking: "Shared Banking System"
    TUR_establish_shared_banking_desc: "Even with a looser economy, a joint structure is necessary to prevent full subjugation to outside powers or internal anarchy. With how varied our environments and resources are across the empire, having a way to coordinate finances and resources between each other will prove crucial. Even when the federation is loose, a shared sense of prosperity is crucial to preventing renewed desires for separatism."
    TUR_proclaim_the_federation: "Proclaim the Federation"
    TUR_proclaim_the_federation_desc: "Our progress is near complete and ready to be unveiled to the world. While we will always have our Sultan to rally around, we can truly bring the era of federalism to a start. The rest of the world will look on with envy, ready and willing to take us down, but we care little for what they have to say. Be it east or west, north or south, our vilayets stand ready to take on all challengers. For the first time in Millenia, Anatolia will not be the heartland of empires, but of stable democracy."
    TUR_free_market_free_people: "The Freer the Market, the Freer the People"
    TUR_free_market_free_people_desc: "With how much autonomy our various vilayets have, attempting to implement harsh and direct economic control would be an exercise in futility. For a system like this, letting the economy and private actors do their own thing is in everyone's best interests. Even still, there is plenty that we can do. Despite our miraculous recovery over the past couple of decades, there is still much we need to do for our continued survival to be more than just a fluke."
    TUR_open_constantinople_stock_exchange: "Open Constantinople Stock Exchnage"
    TUR_open_constantinople_stock_exchange_desc: "Despite everything, we still lack a modern stock exchange. If we are to have a truly free market, we must catch up with the times and bring our stock exchange up to snuff. Our old one which was established during the era of the Tanzimat reforms was more of a small bandage across a multitude of open wounds. Simply reforming it will not do, it is a relic of a bygone era. Better to close it down entirely and just start fresh; A new exchange for a new empire."
    TUR_subsidise_oil_companies: "Subsidze Oil Companies"
    TUR_subsidise_oil_companies_desc: "As our vast oil deposits make us wealthy, they are still vulnerable to global shocks. While our other industries grow, keeping the oil money flowing will be our top priority until we can stand without it. Providing subsidies to them as means of keeping them going will be our best step for the time being. With tensions rising by the day and the need to fuel the vast engines of war becoming more and more needed, the subsidies shouldn’t be needed for long until the hunger for oil will justify its own existence."    
    TUR_allow_forgein_investment: "Allow Forgien Investment"
    TUR_allow_forgein_investment_desc: "Even with a stronger economy, there are far more funds outside of us than inside of us. Luckily for us, investors from all over Europe and America are eyeing our resource wealth greedily, wanting a slice of it for themselves. We have previously been hesitant to open up more than absolutely necessary so as to not condemn ourselves to the same debt trap that lost us Egypt. Now that we have a proper industrial base however, it is much safer to let private actors outside the empire throw their money at us without fear."
    TUR_libyan_oil_drilling: "Libyan Oil Drilling"
    TUR_libyan_oil_drilling_desc: "As it turns out, Arabia is not our only source of oil. Several local archaeologists have reported potential oil reserves to be lurking inside of our Libyan holdings. Upon further investigation, it appears that they were indeed correct. Upon even further investigation, there is even more than anyone could have imagined. With most of our competitors discovering more oil fields as well as methods of discovering oil, we must further increase our supply of the crucial resource to not be left behind in the resource war."
    TUR_anatolian_road_program: "Anatolian Road Program"
    TUR_anatolian_road_program_desc: "As a whole, Anatolia is a very mountainous region. Attempting to construct proper roads on it was a near impossibility during our chronic decline. There were always higher priorities for us to deal with, never having the time or funds to focus on something so seemingly insignificant. Now that we have the funds to spare, we can finally dedicate some attention to the long neglected issue. The larger cities were always fine due to them focussing their own budgets on roads, but the more rural areas suffered immensely from this lack of attention, leading to rapid stagnation."
    TUR_mechanize_agriculture: "Mechanize Argiculture Production"
    TUR_mechanize_agriculture_desc: "Despite our economy being more agrarian than not until very recently, our agricultural practices are centuries behind. This shift away towards a more industrial economy combined with outdated practices have a massive hole in our economy that oil and industry can only do so much for. Failure to address it any longer will forever curse us with a limp arm that we cannot use for any purpose, leaving us vulnerable to famine in times of war when we cannot import as much ourselves."
    TUR_protect_property_rights: "Protect Property Rights"
    TUR_protect_property_rights_desc: "With a modern economy comes with all of the issues it provides. Much of the urban countryside has reported having their property rights violated due to either technicalities or straight up corruption. The corruption issue we already know how to deal with, we’ve been doing it for centuries, but the technicalities are a different matter. Fortunately for us, the societies which have already dealt with this issue have provided for us a template from which to follow. All it will need a few tweaks to suit our unique situations and the issue will be addressed."
    TUR_laissez_faire_economics: "Laissez-Faire Economics"
    TUR_laissez_faire_economics_desc: "Much like our laws, our economics are far more decentralized than most other parts of the world. We have become a shining example of how a state can properly apply true laissez faire policy in a world stuck in the struggle between centralized and decentralized economics. Students of the future will open their textbooks to learn from our example, its successes and flaws. For now there is little left to do on our end. We simply need to keep the government running while the money flows on its own."
    TUR_revisit_oil_concessions: "Revist Oil Concessions"
    TUR_revisit_oil_concessions_desc: "While the concessions on our oil fields were necessary to kickstart our economic boom, it is also proven to be a hassle which stunts potential further profits. We are no longer on death's door, so perhaps there is a chance we could regain what is ours. The negotiations will be long and painful, but we now have the economic strength to negotiate toe to toe with them as someone on relative footing. They cannot afford to treat us as an uncivilized state to be colonized, but a power to be dealt with."
    TUR_pay_of_debt_in_full_now: "Pay Debt in Full Now"
    TUR_pay_of_debt_in_full_now_desc: "In exchange for the oil rights, they agreed to give up a section of our admittedly large debt. What this has done is place a price on the oil fields, one that we now have the means to repay. Of course the price will be higher due to inflation, the need to rearm, the costs of the last war and mainly the fact that they hold the fields we wish to buy. Still, it is highly likely that the concessions can be bought out, we merely need to negotiate the price."
    TUR_make_a_deal: "Make a Deal"
    TUR_make_a_deal_desc: "The colonial powers holding our oil fields are overstretched, with many wanting nothing more than to kick them out and take the regional wealth for themselves. Though the black gold is valuable, perhaps their fear is greater than their greed. Germany is showing itself to be preparing for revenge, the Balkans and prepared to light themselves on fire, and any action Russia takes will cause a stir in London. By leveraging our support and assistance where we can, they will be the ones making concessions to us instead."
    TUR_return_of_oil: "Return of Our Oil"
    TUR_return_of_oil_desc: "As we speak, the foreign agents are boarding shift bound for more friendly ports. What's left is some equipment, paperwork, and men whose work will finally serve their homes. The black gold is quickly becoming more and more valuable by the day, so having more of its wealth flowing into our coffers can only be a gift from Allah himself. It’s a good thing this wealth came in now, tensions are rising higher and higher by the day. Any advantage we can get is better in our hands than theirs."
    TUR_defender_of_middleeastern_democracy: "Defender of Middle Eastern Democracy"
    TUR_defender_of_middleeastern_democracy_desc: "The news of our federation is out and the world has reacted. For every note of congratulations, you have a hostile neighbor denouncing it as a new mask for oppression. We care little for what they have to say however. They are doing worse to people they consider their own. We have a duty not just to liberate them from tyranny, but to preserve the shining beacon of Middle eastern democracy while those all around us seek to snuff it out."
    TUR_maintain_relations_with_allies: "Maintain Relationship with Former Allies"
    TUR_maintain_relations_with_allies_desc: "Given the current geopolitical tensions, remaining on good terms with our old allies would be the best move going forward. While we would prefer to remain neutral and focus on ourselves, that is something we cannot afford to do. Fortunately for us, London shares many of the same interests as us. They seek to limit the potential threats posed by radical nationalism while preventing chaos in the Mediterranean which could threaten their vital routes to India. So long as we remain in their good graces, we have little to fear."
    TUR_invest_into_arabia: "Invest into Arabia"
    TUR_invest_into_arabia_desc: "The birthplace of Islam is not doing so well in the modern day. Even as its heartland consists of vast and empty deserts, the region still bears much untapped potential for more than just oil. The holy cities in particular are largely held together through hopes and dreams rather than modern construction. Attempting to rebuild the holy cities without risking damage to the holy cites or angering the officials there over violating tradition will be a tall order, but it must be done for the good of those performing their Hajj."
    TUR_tackle_illiteracy: "Tackle Illiteracy"
    TUR_tackle_illiteracy_desc: "No matter how much progress we make as a nation, an illiterate populace means that growth will be permanently stunted. Even the most basic of jobs would still greatly benefit from the ability to read and sign documents as needed. Our lack of literacy has become a bit of a joke among European courts, with many describing our citizens as beneath theirs due to most being unable to read a book. This cannot be allowed to continue, we will never be sick again. Who better to cure a sick man than a doctor with the ability to read."
    TUR_fund_schools: "Fund Education Programs"
    TUR_fund_schools_desc: "No matter what we do, any progress towards literacy will be done away in time without a proper system in place. Especially in more rural areas, we must begin the funding of schools across our federation to ensure that future generations will enter adulthood ready for the modern age. Luckily for us, the curriculum is only a matter for the vilayet under our direct control. The rest of them can best tailor the youths' education for their specific cultural needs. So long as the essentials are covered and a sense of loyalty is fostered, the rest can be left in the hands of those who know what they’re doing."
    TUR_open_university_of_constantinople: "Open the University of Constantinople"
    TUR_open_university_of_constantinople_desc: "Most of our capital's prestige comes from history and location. Beyond simply being the mouth of the Black Sea, very few people have reason to view it higher than something like Paris or London in the modern day. One way we can begin to fix this is building Istanbul up as a center of knowledge within our federation. The Hagia Sofia can only take us so far, a modern university must be constructed to bring the city into the modern age. It is only the first step in a long process, but it is a crucial first step."
    TUR_fortify_the_balkan_border: "Fortify the Balkan Border"
    TUR_fortify_the_balkan_border_desc: "Out of every one of our potential enemies, the Balkan nations are the most ravenous and eager to take us down. It is all but impossible to settle our differences via diplomacy, so we must prepare for war. Our agents have already given us a good idea of where a new Balkan league would be most likely to strike from and against, so that should be where we put our primary efforts. So long as we prepare our defenses accordingly, we will be able to conduct the war on our terms however and whenever we wish."
    TUR_join_britain: "Join Britain"
    TUR_join_britain_desc: "Huzzah, Britain has had the exact same thoughts as us and wish to retain good relations. They have invited representatives to meet with them in Cairo to discuss the details of us formally joining the allies. After many years, they finally see us as more than just a tool to annoy the Russians with. We have become a vital part of the European game of politics, one that London cannot dismiss as a junior partner. While Britannia is focussed on ruling the waves, the war on land will be our burden to bear."
    TUR_request_oman: "Request Oman"
    TUR_request_oman_desc: "As the defenders of the Middle East, it is our sworn duty to ensure the stability and prosperity of all who call it home. Oman is still under British control, families separated by lines on a map drawn through force. Now that we are allied to Britain, we can rectify this issue once and for all while bringing us one step closer to unifying all of Arabia under one banner. With London overstretched and needing to save funds, it shouldn’t be too much of an ask."
    TUR_claim_bosnia: "Claim Bosnia"
    TUR_claim_bosnia_desc: "The Austrian seizure of Bosnia was a disgraceful mark on our stain that must be wiped clear. Their further annexation of it in 1908 was an even bigger insult, one they have since paid dearly for. Though they have paid the price, we still have not received what we are owed. Now that we have the strength to stare our foes down eye to eye, we will make it known that we deserve what is owed to us. The Serbs will no doubt be furious about this, but we care little for what those upstarts think."
    TUR_claim_dobruja: "Claim Dobruja"
    TUR_claim_dobruja_desc: "In addition to being one of our many Black Sea holdings in the past, Dobruja is also a core component of our Bulgarian vilayet. Its seizure from us was yet another violation of our integrity at the scheming hands of Russia. We must do everything in our power to reclaim what is rightfully ours so as to undo the wrongs against us."
    TUR_invade_romania: "Invade Romania"
    TUR_invade_romania_desc: "It is almost inevitable that Romania will seek protection from any who would go against us. Rather than giving them time to build up, we will strike as soon as possible and undo the Romanian mistake. They were always meant to be disunited principalities, mere buffers against our regional rivals. There is no Vlad III to save them anymore, their army is nothing special compared to us, we will bring them to heel here and now."
    TUR_invade_yugoslavia: "Invade Yugoslavia"
    TUR_invade_yugoslavia_desc: "The Serbs are our most persistent and annoying enemies. They managed to break out from under our thumb only to consistently poke the thumb with their neighbors. While Bulgaria and Greece have been brought to heel, the Serbs have only grown stronger. They hypocritically claim us as oppressors only to impose Serbian supremacy on the rest of their kin. It is clear their state has lost the right to exist, and we shall serve as judge, jury and executioner."
    TUR_the_ottoman_army: "The Ottoman Army"
