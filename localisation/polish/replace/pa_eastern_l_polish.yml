 FRA_support_the_finns:0 "Wsparcie Dla wschodnich Sojuszników"
 FRA_support_the_finns_desc:0 "Wzmocnimy naszych wschodnich sojuszników. Czechosłowacja i Rosja otrzymają po dwie fabryki wojskowe poza mapą oraz po pięć wyposażonych dywizji piechoty w swoich stolicach."
 PA_eastern_support_tt:0 "Czechosłowacja i Rosja otrzymają KAŻDA: §G2§! fabryki wojskowe poza mapą oraz §G5§! dywizji piechoty w swojej stolicy. Każda dywizja ma 9 batalionów piechoty, pełny stan osobowy i wyposażenie."
