l_polish:
 PA_faction:0 "Paris accord"
 PA_friendship_desc:0 "Potwierdzimy przyjaźń z Rosją i powołamy Paris accord — nowy sojusz, który połączy europejskie demokracje."
 PA_czechoslovakia_desc:0 "Obejmiemy Czechosłowację ochroną i przyjmiemy ją do naszego sojuszu. Cel dostępny od 1 czerwca 1936 roku."
 PA_spain_desc:0 "Republika hiszpańska dołączy do naszego sojuszu, a Francja i pozostali sojusznicy przystąpią do jej wojny przeciw nacjonalistom. Cel dostępny podczas hiszpańskiej wojny domowej."
 PA_belgium_desc:0 "Francja przejmie Walonię, a Holandia Flandrię. Oba państwa uzyskają prawa narodowe do przyłączonych ziem. Francuskie Kongo zostanie naszą marionetką, a Luksemburg dołączy do Paris accord. Cel dostępny od 1 lutego 1937 roku."
 PA_afghanistan_desc:0 "Poprzemy prorosyjski przewrót w Kabulu. Afganistan stanie się marionetką Rosji. Cel dostępny od 1 stycznia 1938 roku po ukończeniu protekcji Czechosłowacji, interwencji w Hiszpanii i podziału Belgii."
 PA_cyprus_desc:0 "Zaproponujemy Osmanom zakup Cypru w zamian za trzy fabryki cywilne i dwie wojskowe poza mapą. Mogą przyjąć ofertę lub ją odrzucić. Cel dostępny od 1 czerwca 1937 roku, jeśli Turcja posiada i kontroluje Cypr."
 paris_accord.1.t:0 "Nowa ententa"
 paris_accord.1.d:0 "Rząd francuski od czasu końca Wielkiej Wojny w 1916 roku czuje, że pozostaje w cieniu Wielkiej Brytanii, która chce rządzić polityką światową. Francja i Rosja, jako niezależne demokracje, postanowiły ogłosić powstanie nowego sojuszu, który ma scalić demokracje europejskie przeciw przyszłym zagrożeniom. Wielu uważa jednak, że jest to krok wymierzony wprost w hegemonię brytyjską."
 paris_accord.1.a:0 "Co na to Brytyjczycy?"
 paris_accord.2.t:0 "Francuska Interwencja w Hiszpanii"
 paris_accord.2.d:0 "Hiszpania, kraj, który w ostatnich dniach pogrążył się w wojnie domowej, ponownie trafiła na nagłówki gazet. Rząd republikański poprosił o interwencję sojuszu francuskiego, który zgodził się pod warunkiem, że w przyszłości Hiszpania poprze francuską politykę zagraniczną. Dziś rano wojska francuskie przybyły z pomocą i zaczęły zabezpieczać północne miasta Hiszpanii."
 paris_accord.2.a:0 "Jak się to rozwinie?"
 paris_accord.3.t:0 "Upadek Belgii"
 paris_accord.3.d:0 "Dziś rano rządy francuski i holenderski ogłosiły formalną aneksję różnych części Belgii, która rozpadła się po ostatnim kryzysie. Południową część Belgii przejęła Francja, a północną Holandia. Kongo zostało objęte protekcją francuską, a Belgia jako niepodległy kraj zniknęła z map."
 paris_accord.3.a:0 "Przecież to agresja na inny kraj!"
 paris_accord.4.t:0 "Prorosyjski pucz w Afganistanie"
 paris_accord.4.d:0 "Dziś na ulicach Kabulu można było usłyszeć strzały, gdyż władzę w wyniku puczu przejęła prorosyjska partia. W ciągu trzech godzin wszystkie budynki rządowe znalazły się pod jej kontrolą. Nowy rząd ogłosił gotowość i chęć współpracy z Rosją i Francją oraz zamiar przyszłej demokratyzacji."
 paris_accord.4.a:0 "Czy oni są naprawdę niepodlegli?"
 paris_accord.10.t:0 "Kupno Cypru?"
 paris_accord.10.d:0 "W ostatnim czasie rząd francuski przedstawił nam bardzo ciekawą propozycję. Francuzi chcą kupić Cypr i ustanowić na nim swoją bazę wojskową, a w zamian zapłacą nam sporą sumę. Co my na to?"
 paris_accord.10.a:0 "Nie sprzedamy osmańskiej ziemi!"
 paris_accord.10.b:0 "Umowa to umowa!"
 PA_cyprus_refused:0 "Odrzucono ofertę zakupu Cypru"
