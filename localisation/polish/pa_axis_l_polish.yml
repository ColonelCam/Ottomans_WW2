l_polish:
 pa_axis.1.t:0 "Polska i Ukraina dołączają do Osi"
 pa_axis.1.d:0 "Po zwycięskiej wojnie przeciw Rosjanom Polacy i Ukraińcy postanowili wspólnie zadbać o swoje bezpieczeństwo. Aby zabezpieczyć się przed kolejnym atakiem ze strony Sowietów, zdecydowali się dołączyć do Osi. Sojusz ten ma zapewnić im bezpieczeństwo w przyszłości!"
 pa_axis.1.a:0 "Nowy układ sił w Europie."
